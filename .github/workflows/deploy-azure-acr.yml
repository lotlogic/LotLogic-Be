name: Build & Push to Azure ACR

on:
  push:
    branches:
      - stage
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: lotcheck.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: lotcheck.azurecr.io/lotlogic-be
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.azure
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Select image to deploy
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$(echo "${{ steps.meta.outputs.tags }}" | grep ':sha-' | head -n 1)"
          if [ -z "$IMAGE" ]; then
            echo "No sha tag found in generated tags:"
            echo "${{ steps.meta.outputs.tags }}"
            exit 1
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Deploying $IMAGE"

      - name: Deploy to Azure Container Apps
        shell: bash
        run: |
          set -euo pipefail
          az containerapp update \
            --name lotcheck-be \
            --resource-group Production \
            --image "${{ steps.image.outputs.image }}"
