name: Deploy to ECR -> App Runner

on:
  push:
    branches:
      - stage
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: blockplanner/lotlogic
  ECR_REGISTRY: 284818286389.dkr.ecr.ap-southeast-2.amazonaws.com
  IMAGE_TAG: latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Verify ACT GeoJSON files (LFS)
      shell: bash
      run: |
        set -euo pipefail

        echo "🔎 Verifying ACT GeoJSON files exist in the workspace..."
        git lfs ls-files || true

        ZONE_FILE="$(ls -1 data/ACTGOV_TP_LAND_USE_ZONE_*.geojson 2>/dev/null | head -n 1 || true)"
        BLOCK_FILE="$(ls -1 data/ACTGOV_BLOCKS_*.geojson 2>/dev/null | head -n 1 || true)"

        if [ -z "$ZONE_FILE" ] || [ -z "$BLOCK_FILE" ]; then
          echo "❌ Missing expected ACT GeoJSON files under ./data"
          ls -la data || true
          exit 1
        fi

        for f in "$ZONE_FILE" "$BLOCK_FILE"; do
          size="$(stat -c%s "$f" 2>/dev/null || wc -c < "$f")"
          echo "✅ Found $f (${size} bytes)"
          if [ "$size" -lt 1000000 ]; then
            echo "❌ $f is unexpectedly small; likely a Git LFS pointer file."
            head -n 20 "$f" || true
            exit 1
          fi
        done
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      
    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
        IMAGE_TAG: ${{ env.IMAGE_TAG }}
      run: |
        # Build the Docker image
        docker build -t $ECR_REPOSITORY:$IMAGE_TAG -f Dockerfile.prod .

        # Smoke-check the built image contains ACT GeoJSON files
        docker run --rm $ECR_REPOSITORY:$IMAGE_TAG sh -c '
          set -e
          ls -la /app/data
          ZONE_FILE="$(ls -1 /app/data/ACTGOV_TP_LAND_USE_ZONE_*.geojson 2>/dev/null | head -n 1 || true)"
          BLOCK_FILE="$(ls -1 /app/data/ACTGOV_BLOCKS_*.geojson 2>/dev/null | head -n 1 || true)"
          if [ -z "$ZONE_FILE" ] || [ -z "$BLOCK_FILE" ]; then
            echo "Missing ACT GeoJSON files in image under /app/data"
            exit 1
          fi
          echo "Found: $ZONE_FILE"
          echo "Found: $BLOCK_FILE"
        '
        
        # Tag the image for ECR
        docker tag $ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        
        # Push the image to ECR
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        
        echo "Image pushed to ECR: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
        
    - name: Output image URI
      run: |
        echo "Image URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" 
